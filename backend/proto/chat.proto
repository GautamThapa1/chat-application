syntax = "proto3";

package chat;

// =========================================================================== #
// Chat 
// =========================================================================== #
message ChatMessage {
  string role            = 1;
  string content         = 2;
  int64  conversation_id = 3;
}

message ChatResponse {
  string role    = 1;
  string content = 2;
}

message SaveConversationRequest {
  string user_content      = 1;
  string assistant_content = 2;
  int64  conversation_id   = 3;
}

message SaveConversationResponse {
  bool success = 1;
}

message Conversation {
  int64  conversation_id = 1;
  int64  user_id         = 2;
  string title           = 3;
  string created_at      = 4;
  string updated_at      = 5;
}

message ConversationMessage {
  int64  message_id      = 1;
  int64  conversation_id = 2;
  int64  user_id         = 3;
  string role            = 4;
  string content         = 5;
  string created_at      = 6;
}

message CreateConversationRequest {
  string title = 1;
}

message CreateConversationResponse {
  Conversation conversation = 1;
}

message ListConversationsRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListConversationsResponse {
  repeated Conversation conversations = 1;
  int32 total_count = 2;
}

message GetConversationRequest {
  int64 conversation_id = 1;
}

message GetConversationResponse {
  Conversation conversation = 1;
  repeated ConversationMessage messages = 2;
}

message DeleteConversationRequest {
  int64 conversation_id = 1;
}

message DeleteConversationResponse {
  bool success = 1;
}

// =========================================================================== #
// Shared model types
// =========================================================================== #
message Note {
  int64  id         = 1;
  string title      = 2;
  string content    = 3;
  string created_at = 4;
}

message Task {
  int64  id         = 1;
  string title      = 2;
  string due_date   = 3;
  bool   completed  = 4;
  string created_at = 5;
}

// =========================================================================== #
// Notes request/response
// =========================================================================== #
message SaveNoteRequest {
  string title   = 1;
  string content = 2;
}

message SaveNoteResponse {
  Note note = 1;
}

message SearchNotesRequest {
  string keyword = 1;
}

message SearchNotesResponse {
  repeated Note notes = 1;
}

message ClearNotesRequest {}

message ClearNotesResponse {
  int64 deleted_count = 1;
}

// =========================================================================== #
// Tasks request/response
// =========================================================================== #
message CreateTaskRequest {
  string title    = 1;
  string due_date = 2;  // "" when unset
}

message CreateTaskResponse {
  Task task = 1;
}

message ListTasksRequest {}

message ListTasksResponse {
  repeated Task tasks = 1;
}

message CompleteTaskRequest {
  int64 task_id = 1;
}

message CompleteTaskResponse {
  bool success = 1;
}

// =========================================================================== #
// Auth request/response
// =========================================================================== #
message RegisterRequest {
  string username = 1;
  string password = 2;
}

message RegisterResponse {
  int64 user_id = 1;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string session_token = 1;
  int64  user_id       = 2;
}

message LogoutRequest {
  string session_token = 1;
}

message LogoutResponse {}

message ValidateSessionRequest {
  string session_token = 1;
}

message ValidateSessionResponse {
  bool  valid   = 1;
  int64 user_id = 2;
}

// =========================================================================== #
// Service
// =========================================================================== #
service ChatService {
  rpc SendMessage(ChatMessage) returns (ChatResponse);
  rpc CreateConversation(CreateConversationRequest) returns (CreateConversationResponse);
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);
  rpc GetConversation(GetConversationRequest) returns (GetConversationResponse);
  rpc DeleteConversation(DeleteConversationRequest) returns (DeleteConversationResponse);
  rpc Register(RegisterRequest)                 returns (RegisterResponse);
  rpc Login(LoginRequest)                       returns (LoginResponse);
  rpc Logout(LogoutRequest)                     returns (LogoutResponse);
  rpc ValidateSession(ValidateSessionRequest)   returns (ValidateSessionResponse);
  rpc SaveConversation(SaveConversationRequest) returns (SaveConversationResponse);

  rpc SaveNote(SaveNoteRequest)         returns (SaveNoteResponse);
  rpc SearchNotes(SearchNotesRequest)   returns (SearchNotesResponse);
  rpc ClearNotes(ClearNotesRequest)     returns (ClearNotesResponse);
  rpc CreateTask(CreateTaskRequest)     returns (CreateTaskResponse);
  rpc ListTasks(ListTasksRequest)       returns (ListTasksResponse);
  rpc CompleteTask(CompleteTaskRequest) returns (CompleteTaskResponse);
}