<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Luma Chat</title>
    <style>
      /* ---------- Design tokens: change colours here, once ---------- */
      :root {
        --bg: #ffffff;
        --bg-soft: #f7f7f8;
        --sidebar: #f9f9f9;
        --hover: #ececf1;
        --active: #e4e4ea;
        --text: #1a1a1a;
        --muted: #6b6f76;
        --line: #e5e5ea;
        --accent: #167d73;
        --accent-hover: #116b62;
        --accent-soft: #e6f4f1;
        --user-bubble: #f0f0f3;
        --danger: #b3261e;
        --danger-soft: #fdecea;
        --shadow: 0 2px 12px rgb(0 0 0 / 8%);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #212123;
          --bg-soft: #2a2a2d;
          --sidebar: #181819;
          --hover: #2a2a2d;
          --active: #343438;
          --text: #ececf0;
          --muted: #9a9ca3;
          --line: #35353a;
          --accent: #3bb3a5;
          --accent-hover: #55c7ba;
          --accent-soft: #1d3633;
          --user-bubble: #303034;
          --danger: #f2796f;
          --danger-soft: #3a2220;
          --shadow: 0 2px 12px rgb(0 0 0 / 40%);
        }
      }

      * { box-sizing: border-box; }

      html, body { height: 100%; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-size: 15px;
      }

      [hidden] { display: none !important; }

      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        border: 0;
        background: none;
      }

      button:disabled { cursor: not-allowed; opacity: 0.45; }
      button:focus-visible,
      textarea:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      svg.icon {
        width: 16px;
        height: 16px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* ---------- App shell ---------- */
      .app {
        display: grid;
        grid-template-columns: 272px minmax(0, 1fr);
        height: 100%;
        height: 100dvh;
      }

      .sidebar {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        padding: 12px 8px 8px;
        background: var(--sidebar);
        border-right: 1px solid var(--line);
      }

      .sidebar-top {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 4px 10px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }

      .brand-mark {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 15px;
        font-weight: 700;
      }

      .new-chat {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        font-weight: 550;
      }

      .new-chat:hover { background: var(--hover); }

      #conversations {
        flex: 1;
        min-height: 0;
        margin-top: 10px;
        overflow-y: auto;
        overscroll-behavior: contain;
      }

      .conversation-group {
        padding: 12px 10px 4px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }

      .conversation-item {
        position: relative;
        display: flex;
        align-items: center;
        border-radius: 8px;
      }

      .conversation-item:hover { background: var(--hover); }
      .conversation-item.active { background: var(--active); }

      .conversation-select {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1;
        min-width: 0;
        padding: 9px 10px;
        border-radius: 8px;
        text-align: left;
        font-size: 14px;
      }

      .conversation-title {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .conversation-delete {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        margin-right: 4px;
        border-radius: 6px;
        color: var(--muted);
        opacity: 0;
      }

      /* Delete shows on hover/focus, and always for the open chat and on touch screens. */
      .conversation-item:hover .conversation-delete,
      .conversation-item.active .conversation-delete,
      .conversation-delete:focus-visible { opacity: 1; }
      @media (hover: none) { .conversation-delete { opacity: 1; } }
      .conversation-delete:hover { background: var(--danger-soft); color: var(--danger); }

      .conversation-empty { padding: 12px; color: var(--muted); font-size: 13px; }

      #load-more-conversations {
        margin: 4px 4px 0;
        padding: 8px;
        border-radius: 8px;
        color: var(--muted);
        font-size: 13px;
      }

      #load-more-conversations:hover { background: var(--hover); }

      .sidebar-user {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 8px;
        padding: 10px 8px 6px;
        border-top: 1px solid var(--line);
      }

      .avatar {
        display: grid;
        place-items: center;
        flex: none;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        font-weight: 650;
        text-transform: uppercase;
      }

      .user-meta { flex: 1; min-width: 0; }

      #user-name {
        overflow: hidden;
        font-weight: 600;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .connection {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
      }

      .connection::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #b5b8bf;
      }

      .connection.connected::before { background: #2eaa79; }
      .connection.error::before { background: #e0705f; }

      .icon-button {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 8px;
        color: var(--muted);
      }

      .icon-button:hover { background: var(--hover); color: var(--text); }

      /* ---------- Chat column ---------- */
      .chat {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        background: var(--bg);
      }

      .topbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
      }

      #menu { display: none; }

      #chat-title {
        flex: 1;
        min-width: 0;
        margin: 0;
        overflow: hidden;
        font-size: 15px;
        font-weight: 600;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #log {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
      }

      .thread {
        display: flex;
        flex-direction: column;
        gap: 22px;
        width: min(100%, 768px);
        min-height: 100%;
        margin: 0 auto;
        padding: 28px 20px 24px;
      }

      .message { display: flex; gap: 12px; min-width: 0; }
      .message.user { justify-content: flex-end; }

      .message-body { min-width: 0; max-width: 100%; }
      .message.user .message-body { display: flex; flex-direction: column; align-items: flex-end; max-width: 85%; }
      .message.assistant .message-body { flex: 1; }

      .assistant-avatar {
        display: grid;
        place-items: center;
        flex: none;
        width: 30px;
        height: 30px;
        margin-top: 2px;
        border: 1px solid var(--line);
        border-radius: 50%;
        color: var(--accent);
        font-size: 14px;
        font-weight: 700;
      }

      .bubble {
        line-height: 1.65;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      .message.user .bubble {
        padding: 10px 16px;
        border-radius: 18px;
        background: var(--user-bubble);
      }

      .message.assistant .bubble { padding: 4px 0; }

      /* Action buttons are always in the DOM and visible: no hover, no timers. */
      .actions {
        display: flex;
        gap: 2px;
        margin-top: 4px;
        min-height: 30px;
      }

      .message.user .actions { justify-content: flex-end; }

      .action {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 9px;
        border-radius: 8px;
        color: var(--muted);
        font-size: 13px;
      }

      .action:hover:not(:disabled) { background: var(--hover); color: var(--text); }

      .edit-box {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: min(100%, 560px);
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--bg-soft);
      }

      .edit-box textarea {
        width: 100%;
        min-height: 72px;
        padding: 8px;
        resize: vertical;
        border: 0;
        outline: none;
        background: transparent;
        color: inherit;
        font: inherit;
        line-height: 1.5;
      }

      .edit-buttons { display: flex; justify-content: flex-end; gap: 8px; }

      .button {
        padding: 7px 14px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 550;
      }

      .button.primary { background: var(--accent); color: #fff; }
      .button.primary:hover:not(:disabled) { background: var(--accent-hover); }
      .button.secondary { border: 1px solid var(--line); }
      .button.secondary:hover { background: var(--hover); }

      /* Loading indicator: three bouncing dots + label */
      .thinking {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 6px 0;
        color: var(--muted);
      }

      .dots { display: inline-flex; gap: 4px; }

      .dots span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--muted);
        animation: bounce 1.2s infinite ease-in-out;
      }

      .dots span:nth-child(2) { animation-delay: 0.15s; }
      .dots span:nth-child(3) { animation-delay: 0.3s; }

      @keyframes bounce {
        0%, 60%, 100% { opacity: 0.35; transform: translateY(0); }
        30% { opacity: 1; transform: translateY(-4px); }
      }

      .spinner {
        flex: none;
        width: 13px;
        height: 13px;
        border: 2px solid var(--line);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin { to { transform: rotate(360deg); } }

      .notice {
        align-self: center;
        padding: 6px 12px;
        border-radius: 999px;
        background: var(--bg-soft);
        color: var(--muted);
        font-size: 13px;
        text-align: center;
      }

      .notice.error { background: var(--danger-soft); color: var(--danger); }

      /* ---------- Empty state ---------- */
      .empty-state {
        margin: auto;
        width: 100%;
        text-align: center;
      }

      .empty-state h2 {
        margin: 0 0 6px;
        font-size: 28px;
        letter-spacing: -0.02em;
      }

      .empty-state p { margin: 0 0 22px; color: var(--muted); }

      .prompt-hints {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
        gap: 10px;
        text-align: left;
      }

      .hint-button {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        font-size: 14px;
      }

      .hint-button:hover { background: var(--hover); }

      .hint-operation {
        color: var(--accent);
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      /* ---------- Composer ---------- */
      .composer {
        width: min(100%, 768px);
        margin: 0 auto;
        padding: 8px 20px calc(10px + env(safe-area-inset-bottom));
      }

      .composer-box {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        padding: 8px 8px 8px 16px;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--bg-soft);
        box-shadow: var(--shadow);
      }

      .composer-box:focus-within { border-color: var(--accent); }

      #input {
        flex: 1;
        min-width: 0;
        max-height: 200px;
        padding: 7px 0;
        resize: none;
        border: 0;
        outline: none;
        background: transparent;
        color: inherit;
        font: inherit;
        line-height: 1.5;
      }

      #input::placeholder { color: var(--muted); }

      .send-button {
        display: grid;
        place-items: center;
        flex: none;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
      }

      .send-button:hover:not(:disabled) { background: var(--accent-hover); }
      .send-button.stop { background: var(--danger); }

      .composer-note {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 12px;
        text-align: center;
      }

      /* ---------- Sign in ---------- */
      .auth {
        display: grid;
        place-items: center;
        min-height: 100%;
        padding: 24px 16px;
        background: var(--bg-soft);
      }

      .auth-card {
        width: min(100%, 380px);
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--bg);
        box-shadow: var(--shadow);
      }

      .auth-card h2 { margin: 22px 0 0; font-size: 20px; letter-spacing: -0.02em; }

      .auth-card form { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }

      .auth-card label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        color: var(--muted);
        font-size: 13px;
      }

      .auth-card input {
        padding: 11px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--bg-soft);
        color: var(--text);
        font: inherit;
      }

      .auth-error { min-height: 18px; margin: 0; color: var(--danger); font-size: 13px; }
      .auth-switch { margin: 16px 0 0; color: var(--muted); font-size: 14px; text-align: center; }
      .link-button { color: var(--accent); font-weight: 600; }
      .link-button:hover { text-decoration: underline; }

      /* ---------- Small screens: sidebar becomes a slide-in drawer ---------- */
      .scrim { display: none; }

      @media (max-width: 768px) {
        .app { grid-template-columns: minmax(0, 1fr); }

        .sidebar {
          position: fixed;
          inset: 0 auto 0 0;
          z-index: 20;
          width: min(86vw, 300px);
          transform: translateX(-100%);
          transition: transform 180ms ease;
          padding-top: calc(12px + env(safe-area-inset-top));
        }

        .app.sidebar-open .sidebar { transform: none; box-shadow: var(--shadow); }

        .app.sidebar-open .scrim {
          display: block;
          position: fixed;
          inset: 0;
          z-index: 10;
          background: rgb(0 0 0 / 40%);
        }

        #menu { display: grid; }
        .thread { padding: 20px 14px 16px; }
        .composer { padding-inline: 12px; }
        .action .label { display: none; }
        .action { padding: 8px 10px; }
        .message.user .message-body { max-width: 92%; }
        .empty-state h2 { font-size: 24px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <section id="auth" class="auth" aria-labelledby="auth-title" hidden>
      <div class="auth-card">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">✳</div>
          <span>Luma Chat</span>
        </div>
        <h2 id="auth-title">Log in</h2>
        <form id="auth-form" novalidate>
          <label>
            Username
            <input id="auth-username" autocomplete="username" maxlength="32" required />
          </label>
          <label>
            Password
            <input id="auth-password" type="password" autocomplete="current-password" maxlength="128" required />
          </label>
          <p id="auth-error" class="auth-error" role="alert"></p>
          <button id="auth-submit" class="button primary" type="submit">Log in</button>
        </form>
        <p class="auth-switch">
          <span id="auth-switch-text">No account yet?</span>
          <button id="auth-switch" class="link-button" type="button">Create one</button>
        </p>
      </div>
    </section>

    <div id="chat" class="app" hidden>
      <div id="scrim" class="scrim"></div>

      <aside id="sidebar" class="sidebar" aria-label="Conversation history">
        <div class="sidebar-top">
          <div class="brand">
            <div class="brand-mark" aria-hidden="true">✳</div>
            <span>Luma</span>
          </div>
        </div>
        <button id="new-chat" class="new-chat" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          New chat
        </button>
        <nav id="conversations" aria-label="Conversations"></nav>
        <button id="load-more-conversations" type="button" hidden>Show more</button>
        <div class="sidebar-user">
          <div id="user-avatar" class="avatar" aria-hidden="true">?</div>
          <div class="user-meta">
            <div id="user-name">Guest</div>
            <div id="connection" class="connection" role="status">Disconnected</div>
          </div>
          <button id="logout" class="icon-button" type="button" title="Log out" aria-label="Log out">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          </button>
        </div>
      </aside>

      <section class="chat">
        <header class="topbar">
          <button id="menu" class="icon-button" type="button" aria-label="Open conversations">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          </button>
          <h1 id="chat-title">New chat</h1>
        </header>

        <div id="log" aria-label="Conversation">
          <div id="thread" class="thread" aria-live="polite"></div>
        </div>

        <form id="form" class="composer">
          <div class="composer-box">
            <textarea id="input" rows="1" autocomplete="off" placeholder="Message Luma…" aria-label="Message"></textarea>
            <button id="send" class="send-button" type="submit" aria-label="Send message" title="Send">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
          </div>
          <p class="composer-note">Enter to send · Shift+Enter for a new line</p>
        </form>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
