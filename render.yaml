# Render Blueprint — FREE plan only (no disk, no paid add-ons).
#
# One Docker web service runs the gRPC ChatService and the FastAPI app together
# (deploy/start.sh). The free filesystem is wiped on every deploy/restart/
# spin-down, so the encrypted SQLite file is restored from and backed up to
# free S3-compatible storage (Backblaze B2) by backend/service/db_backup.py.
# Secrets marked `sync: false` are typed into the Render dashboard.
services:
  - type: web
    name: chat-application-api   # live URL: https://chat-application-api-m2n9.onrender.com
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerCommand: ./deploy/start.sh
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DB_PATH
        value: /data/app.db
      - key: COOKIE_SECURE
        value: "true"
      - key: ALLOWED_ORIGINS
        sync: false          # https://<your-project>.vercel.app
      - key: DATABASE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: QDRANT_URL
        sync: false          # https://<cluster>.cloud.qdrant.io:6333
      - key: QDRANT_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false          # mailto:you@example.com
      # Database backup (Backblaze B2 free tier, S3-compatible API)
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_ENDPOINT
        sync: false          # https://s3.<region>.backblazeb2.com
      - key: BACKUP_S3_REGION
        sync: false          # e.g. us-west-004
      - key: BACKUP_S3_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET
        sync: false
      - key: BACKUP_INTERVAL_SECONDS
        value: "60"
