[project]
name = "chat-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.2",
    "google-genai>=1.0,<3.0",
    "langgraph>=1.0,<2.0",
    "grpcio>=1.85.3",
    "grpcio-tools>=1.85.3",
    "limits>=5.8.0",
    "python-dotenv>=1.2.4",
    "pywebpush>=2.0,<3",
    "qdrant-client>=1.12,<2",
    "slowapi>=0.1.10",
    "sqlcipher3-binary>=0.6.0",
    "uvicorn[standard]>=0.54.0",
    "boto3>=1.35,<2",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
